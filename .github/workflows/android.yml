name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Restore Haxelib Cache
        id: cache-haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('.github/workflows/android.yml') }}

      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: export/release/android/obj
          key: hxcpp-${{ runner.os }}-${{ hashFiles('.github/workflows/android.yml', 'Project.xml') }}-${{ github.sha }}
          restore-keys: |
            hxcpp-${{ runner.os }}-${{ hashFiles('.github/workflows/android.yml', 'Project.xml') }}-

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('.github/workflows/android.yml') }}

      - name: Setup Haxelib
        run: haxelib setup ~/haxelib

      - name: Install Haxelibs
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        run: |
          haxelib install hxcpp 4.3.2 --quiet
          haxelib install lime 8.3.2 --quiet
          haxelib install openfl 9.5.2 --quiet
          haxelib install flixel 6.2.1 --quiet
          haxelib install flixel-addons 4.0.1 --quiet
          haxelib git flixel-ui https://github.com/HaxeFlixel/flixel-ui --quiet
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit --quiet

      - name: List Haxelibs
        run: haxelib list

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Build
        run: haxelib run lime build android -final

      - name: Sign APK
        run: |
          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APK=$(find export/release/android/bin/app/build/outputs/apk -name "*.apk" | head -1)
          keytool -genkeypair -keystore ci.keystore -storepass qtmodci -keypass qtmodci -alias qtmod -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=QT Mod"
          $BUILD_TOOLS/zipalign -f -p 4 "$APK" aligned.apk
          mkdir -p output
          $BUILD_TOOLS/apksigner sign --ks ci.keystore --ks-pass pass:qtmodci --key-pass pass:qtmodci --out output/QTMod.apk aligned.apk
          $BUILD_TOOLS/apksigner verify output/QTMod.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QTMod-Android
          path: output/QTMod.apk
          if-no-files-found: error
